name: Android Release

# Builds the Capacitor Android app, attaches the signed APK to a GitHub
# Release (so it's downloadable without ever being committed to git
# history), and tags the matching Docker image on ghcr.io with the same
# version, so a given APK version and its server image line up.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/comprofix/bankroll
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor web assets
        run: npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Determine version
        id: vars
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "version_name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "version_code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore.jks"

      - name: Build release APK
        working-directory: android
        env:
          APP_VERSION_NAME: ${{ steps.vars.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.vars.outputs.version_code }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.keystore.jks"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "bankroll-${{ steps.vars.outputs.version_name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bankroll-${{ steps.vars.outputs.version_name }}.apk
          generate_release_notes: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Tags whatever :latest currently points to with the release version —
      # the web app the APK was actually tested against — without rebuilding
      # the image. docker-build.yml already built and pushed it on the
      # triggering commit (or an earlier one, if this commit didn't touch
      # app source).
      - name: Tag matching Docker image with release version
        run: docker buildx imagetools create --tag "${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version_name }}" "${{ env.IMAGE_NAME }}:latest"

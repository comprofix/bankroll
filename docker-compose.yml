services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bankroll
      POSTGRES_PASSWORD: bankroll
      POSTGRES_DB: bankroll
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://bankroll:bankroll@db:5432/bankroll
    ports:
      - "3000:3000"

volumes:
  db-data:

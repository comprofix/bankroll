# Two ways to supply the ${VAR} values used throughout this file:
#
# - Portainer git-stack deploys: set them under the stack's "Environment
#   variables" UI. There's no literal .env file on disk in that flow.
#
# - Manual `docker compose` on any other Docker host: create a `.env` file
#   next to this one (e.g. `cp .env.prod.example .env` and fill it in), then
#   run `docker compose -f docker-compose.prod.yml up -d`. Compose reads a
#   same-directory .env automatically for ${VAR} substitution — this is
#   Compose's own built-in behavior, not something this file has to opt
#   into, so no env_file: directive is needed (and deliberately isn't used
#   here — it would inject the same values a second time as literal
#   container env vars, and if ever left active it silently breaks
#   Portainer deploys, which have no .env file to point it at).

services:
  bankroll-app:
    container_name: ${CONTAINER_NAME}
    image: ${IMAGE_NAME:-ghcr.io/comprofix/bankroll}:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - bankroll-db
    environment:
      DATABASE_URL: postgres://bankroll:${POSTGRES_PASSWORD}@bankroll-db:5432/bankroll
      SESSION_SECRET: ${SESSION_SECRET}
      SEED_EMAIL: ${SEED_EMAIL}
      SEED_PASSWORD: ${SEED_PASSWORD}
      # The server's timezone. Session times are stored and displayed as
      # wall-clock time in this zone, so set it to where you play (an IANA
      # name, e.g. Australia/Brisbane). Defaults to UTC.
      TZ: ${TZ:-UTC}
    # No ports: mapping by default -- this file assumes Traefik reaches the
    # container over the `proxy` Docker network, not a published host port.
    # If you're not running Traefik (or any reverse proxy) at all, uncomment
    # this to reach the app directly, and put your own TLS in front of it
    # separately, or accept plain HTTP for local/trusted-network use only:
    # ports:
    #   - "3000:3000"
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      # Required because this container is on two networks (proxy + internal,
      # for the db). Without this, Traefik's Docker provider picks
      # ambiguously between them on each config refresh — it was
      # intermittently landing on the internal network's IP, which Traefik
      # itself has no route to, causing gateway timeouts.
      - traefik.docker.network=proxy
      - traefik.http.routers.${CONTAINER_NAME}.rule=Host(`${HOSTNAME}`)
      - traefik.http.routers.${CONTAINER_NAME}.entrypoints=https
      - traefik.http.routers.${CONTAINER_NAME}.tls=true
      - traefik.http.services.${CONTAINER_NAME}.loadbalancer.server.port=3000

  bankroll-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bankroll
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bankroll
    volumes:
      - bankroll-db-data:/var/lib/postgresql/data
    networks:
      - internal

networks:
  proxy:
    external: true
  internal:

volumes:
  bankroll-db-data:
